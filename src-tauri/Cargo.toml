[package]
name = "toolkits"
version = "1.0.0"
description = "7Toolkits Builder"
authors = ["SevenByte", "Tegal 1337"]
edition = "2021"

[lib]
name = "sevenbyte_toolkits_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hostname = "0.4"